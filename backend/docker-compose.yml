version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lumo-postgres
    environment:
      POSTGRES_DB: lumo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lumo-network

  backend:
    build: .
    container_name: lumo-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/lumo_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production-minimum-256-bits
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - lumo-network

volumes:
  postgres-data:

networks:
  lumo-network:
    driver: bridge
